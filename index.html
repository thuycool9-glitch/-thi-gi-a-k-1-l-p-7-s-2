<!DOCTYPE html>
<html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ENGLISH 7 – MIDTERM 1 TEST 2</title>
<style>
:root{--bg:#eef3ff;--card:#fff;--ink:#1f2a44;--mut:#6b7794;--pri:#4f46e5;--ok:#16a34a;--bad:#dc2626;--warn:#f59e0b;--line:#dbe3f5}
*{box-sizing:border-box}body{margin:0;font-family:"Segoe UI",Roboto,Arial,sans-serif;background:linear-gradient(160deg,#e8eeff,#f6efff);color:var(--ink);min-height:100vh}
.wrap{max-width:1000px;margin:0 auto;padding:16px}.card{background:var(--card);border-radius:18px;box-shadow:0 6px 24px rgba(60,70,140,.12);padding:20px;margin-bottom:14px}
h1{margin:0 0 6px;font-size:clamp(24px,5vw,38px);color:var(--pri)}h2{margin:0 0 8px}.mut{color:var(--mut)}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:12px 18px;font-weight:700;background:var(--pri);color:#fff;transition:.15s}
button:hover:not(:disabled){transform:translateY(-1px);filter:brightness(1.08)}button:disabled{opacity:.45;cursor:not-allowed}
button.sec{background:#e7ebfb;color:var(--ink)}button.warn{background:var(--warn);color:#fff}button.ok{background:var(--ok)}
input[type=text],input[type=number]{font:inherit;padding:10px 12px;border:2px solid var(--line);border-radius:10px;width:100%}
.grid{display:grid;gap:10px}.g3{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}.info{background:#f4f6ff;border-radius:12px;padding:12px;font-size:15px}
.top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}.pill{background:#eef0ff;border-radius:999px;padding:6px 14px;font-weight:700;font-size:14px}
.bar{height:10px;background:#e3e8fa;border-radius:9px;overflow:hidden;margin-top:10px}.bar i{display:block;height:100%;background:linear-gradient(90deg,#6366f1,#22c55e);transition:.3s}
.sec-t{font-size:13px;font-weight:700;color:var(--pri);text-transform:uppercase;letter-spacing:.5px}.ins{font-style:italic;color:var(--mut);font-size:14px;margin:4px 0 10px}
.pass{background:#fffaf0;border-left:5px solid var(--warn);border-radius:10px;padding:14px;margin:10px 0;line-height:1.7;font-size:16px}
.bl{background:#e0e7ff;border-radius:6px;padding:0 6px;font-weight:700;white-space:nowrap}.bl.cur{background:var(--pri);color:#fff}
.stem{font-size:19px;line-height:1.6;margin:10px 0;font-weight:600}.stem small{display:block;font-weight:400;font-size:16px;line-height:1.7;margin-top:6px}
.opts{display:grid;gap:10px;margin-top:10px}.opt{display:flex;gap:12px;align-items:center;text-align:left;width:100%;background:#fff;color:var(--ink);border:2px solid var(--line);min-height:54px;font-weight:500;font-size:17px}
.opt b{background:#eef0ff;border-radius:8px;min-width:32px;height:32px;display:grid;place-items:center;color:var(--pri)}
.opt.sel{border-color:var(--pri);background:#eef0ff}.opt.right{background:#dcfce7;border-color:var(--ok)}.opt.wrong{background:#fee2e2;border-color:var(--bad);animation:sh .35s}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.fb{border-radius:12px;padding:12px;margin-top:12px;line-height:1.55}.fb.ok{background:#dcfce7;border:1px solid var(--ok)}.fb.no{background:#fee2e2;border:1px solid var(--bad)}.chk{background:#fef3c7;border:1px dashed var(--warn);border-radius:10px;padding:8px 10px;margin-top:8px;font-size:14px}
.sign{display:block;max-width:100%;margin:8px 0;border:1px solid var(--line);border-radius:10px;background:#fff}
.nav{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;margin-top:16px}
.pal{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px;margin-top:8px}.pal button{padding:8px 0;background:#eef0ff;color:var(--ink);font-size:14px;position:relative}
.pal .done{background:#bfdbfe}.pal .c{background:#bbf7d0}.pal .w{background:#fecaca}.pal .cur{outline:3px solid var(--pri)}.pal .mk::after{content:"⚑";position:absolute;top:-6px;right:-2px;color:var(--warn);font-size:14px}
.modal{position:fixed;inset:0;background:rgba(20,25,50,.55);display:grid;place-items:center;z-index:9;padding:16px}.modal .card{max-width:440px;text-align:center}
.big{font-size:54px;font-weight:800;color:var(--pri)}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:12px 0}.stats div{background:#f4f6ff;border-radius:12px;padding:12px;text-align:center}.stats b{display:block;font-size:26px}
.rv{border-top:1px solid var(--line);padding:10px 0;font-size:15px;line-height:1.5}.hide{display:none}
@media print{body{background:#fff}.noprint,.nav{display:none!important}.card{box-shadow:none}}
</style></head><body><div class="wrap" id="app"></div>

a:"<b>EXPLORE YOUR HOBBIES!</b><br>Hobbies help us relax. My friend, Nam, really {13} playing football every weekend. My sister, Mai, loves {14} models and has a big collection. For me, collecting coins is very {15}. I learn a lot from them. What do you usually do {16} your free time? Share your hobbies with us!",
